name: CI

# Builds the packages and runs the Expecto snapshot suites and the vitest runtime suites.
# master is tested by release.yml, which calls this workflow before ShipIt runs.
on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

# Cancel superseded runs of the same PR or branch, but never a master run gating a release.
# A fixed prefix: under workflow_call, github.workflow is the caller's name, and sharing the
# caller's group would make this job wait on its own caller.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # No submodules: solid/ is upstream reference material nothing builds from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The runtime suites run the Solid compiler and vitest, which need Node 22.12 or later.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.fsproj', 'tools/build.fsx', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build and test
        run: dotnet fsi tools/build.fsx -- test
