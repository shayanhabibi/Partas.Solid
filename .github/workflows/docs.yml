name: Docs

# Builds docs/site with Nacara and publishes it to GitHub Pages.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'docs/site/**'
      # The live examples compile against src/ with the in-repo plugin, so either changes the site.
      - 'src/**'
      - 'tools/Partas.Nacara.Plugins.Solid/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules: solid/ is upstream reference material the site does not use.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The live examples run Fable, the Solid compiler and rolldown, which need Node 22.12 or later.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # The examples build src/Partas.Solid and tools/Partas.Nacara.Plugins.Solid from source. The
      # Nacara theme comes from the committed feed in docs/site/feed; docs/site/nuget.config maps it there.
      - name: Build the site
        run: dotnet fsi tools/build.fsx -- docs
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/site/output

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
